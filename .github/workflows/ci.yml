name: CI

on: [push, pull_request]

jobs:
  backend:
    name: Backend — Lint + Test
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-secret-key-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check backend/

      - name: Security scan (bandit)
        run: bandit -r backend/ -c pyproject.toml

      - name: Check unmigrated model changes
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend — Lint + Type check + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t shorter-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t shorter-frontend:ci ./frontend
